        description: A unique integer value identifying this risk record.
        required: true
      tags:
      - risks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRisk'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRisk'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRisk'
      security:
      - jwtAuth: []
      responses:
        '200':
