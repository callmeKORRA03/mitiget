          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Finding'
          description: ''
    put:
      operationId: findings_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this audit finding.
        required: true
      tags:
