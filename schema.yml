      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Finding'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Finding'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Finding'
        required: true
      security:
