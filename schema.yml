components:
  schemas:
    AccessChange:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        action:
          type: string
          maxLength: 30
        target_email:
          type: string
          format: email
          maxLength: 254
        module:
          type: string
          maxLength: 20
        permission:
          type: string
          maxLength: 30
        scope_name:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
        ai_summary:
          type: string
      required:
      - action
      - created_at
      - id
      - target_email
    CreateUser:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
        first_name:
          type: string
        last_name:
          type: string
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          default: user
      required:
      - email
      - password
    Finding:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        node:
          type: integer
        title:
          type: string
          maxLength: 250
        description:
          type: string
        status:
          $ref: '#/components/schemas/StatusEnum'
        created_by:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - id
      - node
      - title
    KindEnum:
      enum:
      - organization
      - subsidiary
      - branch
      - department
      type: string
      description: |-
        * `organization` - Organization
        * `subsidiary` - Subsidiary
        * `branch` - Branch
        * `department` - Department
    ModuleAssignment:
      type: object
      properties:
        module:
          $ref: '#/components/schemas/ModuleEnum'
      required:
      - module
    ModuleEnum:
      enum:
      - risk
      - audit
      type: string
      description: |-
        * `risk` - Risk
        * `audit` - Internal Audit
    ModuleLicense:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        module:
          $ref: '#/components/schemas/ModuleEnum'
        active:
          type: boolean
        expires_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - module
    OrgNode:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        parent:
          type: integer
          nullable: true
        name:
          type: string
          maxLength: 200
        kind:
          $ref: '#/components/schemas/KindEnum'
      required:
      - id
      - kind
      - name
    PatchedFinding:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        node:
          type: integer
        title:
          type: string
          maxLength: 250
        description:
          type: string
        status:
          $ref: '#/components/schemas/StatusEnum'
        created_by:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedOrgNode:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        parent:
          type: integer
          nullable: true
        name:
          type: string
          maxLength: 200
        kind:
          $ref: '#/components/schemas/KindEnum'
    PatchedRisk:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        node:
          type: integer
        title:
          type: string
          maxLength: 250
        description:
          type: string
        severity:
          type: string
          maxLength: 20
        created_by:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    PermissionEnum:
      enum:
      - view_risk
      - create_risk
      - edit_risk
      - delete_risk
      - view_audit
      - create_audit
      - edit_audit
      - approve_finding
      - close_finding
      type: string
      description: |-
        * `view_risk` - View risks
        * `create_risk` - Create risks
        * `edit_risk` - Edit risks
        * `delete_risk` - Delete risks
        * `view_audit` - View audit findings
        * `create_audit` - Create audit findings
        * `edit_audit` - Edit audit findings
        * `approve_finding` - Approve findings
        * `close_finding` - Close findings
    PermissionGrant:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        target_user_id:
          type: integer
          writeOnly: true
        module:
          $ref: '#/components/schemas/ModuleEnum'
        permission:
          $ref: '#/components/schemas/PermissionEnum'
        node:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - module
      - permission
      - target_user_id
    Risk:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        node:
          type: integer
        title:
          type: string
          maxLength: 250
        description:
          type: string
        severity:
          type: string
          maxLength: 20
        created_by:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - id
      - node
      - title
    RoleEnum:
      enum:
      - super_admin
      - module_admin
      - user
      type: string
      description: |-
        * `super_admin` - Super Admin
        * `module_admin` - Module Admin
        * `user` - Regular User
    StatusEnum:
      enum:
      - open
      - pending
      - approved
      - closed
      type: string
      description: |-
        * `open` - Open
        * `pending` - Pending approval
        * `approved` - Approved
        * `closed` - Closed
    TenantMembership:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
      required:
      - id
      - name
      - role
    TokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - email
      - password
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
