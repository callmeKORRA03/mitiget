openapi: 3.0.3
info:
  title: Mitiget Access Governance API
  version: 1.0.0
  description: Multi-tenant RBAC, module licences and scoped access.
paths:
  /api/admin/access-review/:
    get:
      operationId: admin_access_review_retrieve
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessChange'
          description: ''
    post:
      operationId: admin_access_review_create
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccessChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccessChange'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessChange'
          description: ''
